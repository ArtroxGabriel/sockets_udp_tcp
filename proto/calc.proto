syntax = "proto3";

package calc;

option go_package = "sockets_udp_tcp/pkg/pb/calc";

enum Operation {
  OP_UNSPECIFIED = 0;
  OP_ADD = 1;
  OP_SUBTRACT = 2;
  OP_MULTIPLY = 3;
  OP_DIVIDE = 4;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  STATUS_ERROR = 2;
}

message CalcRequest {
  int32 seq = 1;
  double operand1 = 2;
  Operation op = 3;
  double operand2 = 4;
}

message CalcResponse {
  int32 seq = 1;
  Status status = 2;
  double result = 3;
  string error_message = 4;
}
