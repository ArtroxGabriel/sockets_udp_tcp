version: "3"

tasks:
  default:
    desc: Show help and list available commands
    silent: true
    cmds:
      - task --list

  test:
    desc: Run all Go unit tests with coverage
    cmds:
      - go test -v -cover ./...

  fmt:
    desc: Format Go source code
    cmds:
      - go fmt ./...

  build:
    desc: Build all Go binaries
    cmds:
      - mkdir -p bin
      - go build -o bin/server_udp ./cmd/server_udp
      - go build -o bin/client_udp ./cmd/client_udp
      - go build -o bin/server_tcp ./cmd/server_tcp
      - go build -o bin/client_tcp ./cmd/client_tcp
      - go build -o bin/server_proto ./cmd/server_proto
      - go build -o bin/client_proto ./cmd/client_proto
      - go build -o bin/experiment ./cmd/experiment

  run:server:udp:
    desc: Run CalcServerUDP (accepts CLI flags e.g. -- --loss-rate 0.1)
    cmds:
      - go run ./cmd/server_udp {{.CLI_ARGS}}

  run:client:udp:
    desc: Run CalcClientUDP (accepts CLI flags e.g. -- --addr 127.0.0.1:8081)
    cmds:
      - go run ./cmd/client_udp {{.CLI_ARGS}}

  run:server:tcp:
    desc: Run CalcServerTCP (accepts CLI flags e.g. -- --port 8082)
    cmds:
      - go run ./cmd/server_tcp {{.CLI_ARGS}}

  run:client:tcp:
    desc: Run CalcClientTCP (accepts CLI flags e.g. -- --addr 127.0.0.1:8082)
    cmds:
      - go run ./cmd/client_tcp {{.CLI_ARGS}}

  proto:gen:
    desc: Generate Go protobuf code from proto/calc.proto
    cmds:
      - protoc --go_out=. --go_opt=module=sockets_udp_tcp proto/calc.proto

  run:server:proto:
    desc: Run CalcServerProto (accepts CLI flags e.g. -- --port 8083)
    cmds:
      - go run ./cmd/server_proto {{.CLI_ARGS}}

  run:client:proto:
    desc: Run CalcClientProto (accepts CLI flags e.g. -- --addr 127.0.0.1:8083)
    cmds:
      - go run ./cmd/client_proto {{.CLI_ARGS}}

  run:bun:udp:
    desc: Run Bun UDP Client against CalcServerUDP
    cmds:
      - bun run bun/client_udp.ts

  run:bun:tcp:
    desc: Run Bun TCP Client against CalcServerTCP
    cmds:
      - bun run bun/client_tcp.ts

  run:bun:proto:
    desc: Run Bun Protobuf Client against CalcServerProto
    cmds:
      - bun run bun/client_proto.ts

  experiment:
    desc: Build binaries and run the full Part 3 & 4 comparative experiments suite
    deps: [build]
    cmds:
      - go run ./cmd/experiment
